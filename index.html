<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>macOS Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --window-bg: rgba(255, 255, 255, 0.85);
      --accent-color: #007aff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2560&auto=format&fit=crop') center/cover no-repeat fixed;
      height: 100vh; overflow: hidden; user-select: none;
    }

    /* Desktop Layout - Quadrants */
    .desktop {
      position: absolute; top: 28px; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    }

    .quadrant { display: flex; justify-content: center; align-items: center; }

    /* Icons */
    .desktop-icon {
      width: 140px; display: flex; flex-direction: column; align-items: center;
      cursor: pointer; transition: transform 0.3s ease;
    }
    .desktop-icon:hover { transform: scale(1.15); }
    .icon-img {
      width: 90px; height: 90px; background: rgba(255,255,255,0.2); border-radius: 20px;
      display: flex; align-items: center; justify-content: center; font-size: 45px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2); backdrop-filter: blur(10px); margin-bottom: 10px;
    }
    .icon-label { font-size: 14px; color: white; text-shadow: 0 1px 4px rgba(0,0,0,1); font-weight: 600; }

    /* Central Elements */
    .center-container {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 40px;
    }

    /* Envelope */
    .envelope {
      width: 160px; height: 110px; background: #fff; border: 2px solid #ddd;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 16px; color: #555; cursor: pointer;
      position: relative; transition: transform 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .envelope:hover { transform: translateY(-10px) rotate(2deg); }
    .envelope::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%;
      background: #eee; clip-path: polygon(0 0, 50% 100%, 100% 0);
    }

    /* Note */
    .note-card {
      width: 160px; height: 140px; background: #fdfd96; padding: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2); transform: rotate(-2deg);
      cursor: pointer; transition: transform 0.3s;
    }
    .note-card:hover { transform: rotate(0deg) scale(1.05); }

    /* Windows & Dock styles same as before... */
  </style>
</head>
<body>
  <div class="desktop">
    <div class="quadrant" style="grid-column: 1; grid-row: 1;">
      <div class="desktop-icon" ondblclick="openApp('about')">
        <div class="icon-img">👤</div><div class="icon-label">About Me</div>
      </div>
    </div>
    <div class="quadrant" style="grid-column: 2; grid-row: 1;">
      <div class="desktop-icon" ondblclick="openApp('projects')">
        <div class="icon-img">📂</div><div class="icon-label">Portfolio</div>
      </div>
    </div>
    <div class="quadrant" style="grid-column: 1; grid-row: 2;">
      <div class="desktop-icon" ondblclick="openApp('music')">
        <div class="icon-img">🎵</div><div class="icon-label">Music</div>
      </div>
    </div>
    <div class="quadrant" style="grid-column: 2; grid-row: 2;">
      <div class="desktop-icon" ondblclick="openApp('contact')">
        <div class="icon-img">✉️</div><div class="icon-label">Contact</div>
      </div>
    </div>
  </div>

  <div class="center-container">
    <div class="envelope" onclick="openApp('contact')">OPEN ME</div>
    <div class="note-card" onclick="openApp('trivia')">
      <strong>Fun Fact</strong>
      The first mouse was wooden!
    </div>
  </div>

  <!-- Script and Windows remain -->
  <script>
    // Include previously created openApp/closeApp logic
  </script>
</body>
</html>
